# ClamAV upload scan + webshell filename guards (always blocking).

SecRule FILES "@rx (?i)\.(?:php\d*|phtml|phar|shtml|cgi|pl|py|jsp|asp|aspx|exe|dll|so|sh|bash)$" \
  "id:1902002,\
   phase:2,\
   deny,\
   status:403,\
   log,\
   auditlog,\
   msg:'Dangerous upload extension blocked',\
   tag:'malware',\
   tag:'webshell',\
   tag:'panel-danger',\
   severity:'CRITICAL'"

SecRule FILES "@rx (?i)\.(?:php\d*|phtml|phar)\.[a-z0-9]+$" \
  "id:1902003,\
   phase:2,\
   deny,\
   status:403,\
   log,\
   auditlog,\
   msg:'Double-extension PHP upload blocked',\
   tag:'malware',\
   tag:'webshell',\
   tag:'panel-danger',\
   severity:'CRITICAL'"

SecRule FILES_TMPNAMES "@inspectFile /usr/local/bin/modsec-clamav-inspect.sh" \
  "id:1902001,\
   phase:2,\
   deny,\
   status:403,\
   log,\
   auditlog,\
   msg:'Malware upload blocked by ClamAV',\
   tag:'malware',\
   tag:'clamav',\
   tag:'panel-danger',\
   severity:'CRITICAL'"
