# Panel-tuned ModSecurity engine (Nginx connector).
# Goal: block malware uploads + log dangerous L7 hits — never break account create/delete.

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

SecRequestBodyLimit 536870912
SecRequestBodyNoFilesLimit 13107200
SecRequestBodyLimitAction ProcessPartial
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

SecTmpDir /tmp
SecDataDir /var/cache/modsecurity
SecUploadDir /tmp
SecUploadKeepFiles On
SecUploadFileMode 0600
SecTmpSaveUploadedFiles On
SecUploadFileLimit 10

# Relevant-only audit: not every request — only interesting / blocked.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log
SecAuditLogStorageDir /var/log/modsec/audit/

SecDebugLog /var/log/modsec/debug.log
SecDebugLogLevel 0

SecArgumentSeparator &
SecCookieFormat 0
SecStatusEngine Off
