# ---------------------------------------------------------------------------
# Panel exclusions — account create/delete/provision POSTs must never 403.
# We strip injection/SQLi/XSS CRS tags for business routes, keep RCE/LFI/malware.
# ---------------------------------------------------------------------------

# Admin / agent / seller panel + API: remove noisy CRS body rules that false-positive
# on passwords, WG keys, base64 configs, MikroTik/ASA payloads.
SecRule REQUEST_URI "@rx ^/(admin|agent|seller|api)(/|$)" \
  "id:1901001,\
   phase:1,\
   pass,\
   nolog,\
   ctl:ruleRemoveByTag=attack-sqli,\
   ctl:ruleRemoveByTag=attack-xss,\
   ctl:ruleRemoveByTag=attack-injection,\
   ctl:ruleRemoveByTag=attack-protocol,\
   ctl:ruleRemoveById=920270-920280,\
   ctl:ruleRemoveById=920273-920274,\
   ctl:ruleRemoveById=921110-921999,\
   ctl:ruleRemoveById=941100-941999,\
   ctl:ruleRemoveById=942100-942999,\
   ctl:ruleRemoveById=943100-943999,\
   ctl:ruleRemoveById=933100-933199"

# Login / 2FA / captcha / password reset — same exclusions
SecRule REQUEST_URI "@rx ^/(login|logout|two-factor|password|captcha|sanctum)(/|$)" \
  "id:1901002,\
   phase:1,\
   pass,\
   nolog,\
   ctl:ruleRemoveByTag=attack-sqli,\
   ctl:ruleRemoveByTag=attack-xss,\
   ctl:ruleRemoveByTag=attack-injection,\
   ctl:ruleRemoveById=941100-941999,\
   ctl:ruleRemoveById=942100-942999"

# Client / portal token routes
SecRule REQUEST_URI "@rx ^/(portal|client|store)(/|$)" \
  "id:1901003,\
   phase:1,\
   pass,\
   nolog,\
   ctl:ruleRemoveByTag=attack-sqli,\
   ctl:ruleRemoveByTag=attack-xss,\
   ctl:ruleRemoveByTag=attack-injection,\
   ctl:ruleRemoveById=941100-941999,\
   ctl:ruleRemoveById=942100-942999"

# Never inspect Livewire / Vite / built assets as attacks
SecRule REQUEST_URI "@rx ^/(livewire|build|vendor|fonts|images|storage/)|\\.(css|js|map|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$" \
  "id:1901004,\
   phase:1,\
   pass,\
   nolog,\
   ctl:ruleEngine=Off"
